# Action pins are full commit SHAs, which is the only immutable ref GitHub
# offers — and which nothing would ever bump by hand. Dependabot moves the SHA
# and the trailing version comment together, so the pins stay current without
# the rule living as prose in a skill file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # This one is not a version to keep current: its SHA pins the toolchain
      # the msrv job builds on, and it has to stay equal to rust-version in
      # Cargo.toml. Letting dependabot advance it would leave the job green
      # while checking a floor the crate never claimed.
      - dependency-name: dtolnay/rust-toolchain
