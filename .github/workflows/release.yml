name: Release

on:
  push:
    tags:
      - 'v*'

# Only the publishing job writes; the build matrix just compiles.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: agrf-x86_64-linux
          - target: aarch64-unknown-linux-musl
            artifact: agrf-aarch64-linux
          - target: armv7-unknown-linux-musleabihf
            artifact: agrf-armv7-linux

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      # A prebuilt release rather than `cargo install`, which re-resolves the
      # tool's own dependency tree on every run — a release job that breaks
      # with no change on this side. cargo-zigbuild finds zig through
      # `python -m ziglang`, which is why the pip package is enough.
      # Pinned for the same reason cargo installs carry --locked: an unpinned
      # installer re-resolves on every run, so a release job can break with no
      # change on this side. 0.16.0 is what the v0.3.2 release built with.
      - name: Install zig
        run: pip install ziglang==0.16.0

      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-zigbuild

      - name: Build
        run: cargo zigbuild --target ${{ matrix.target }} --release --locked

      - name: Stage binary
        run: cp "target/${{ matrix.target }}/release/agrf" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # tar preserves the exec bit that upload-artifact and bare gzip drop.
      # Loop + glob so adding a target means editing only the build matrix.
      - name: Package and checksum
        working-directory: dist
        run: |
          for f in agrf-*; do
            install -m755 "$f" agrf
            tar -czf "$f.tar.gz" agrf
            rm -f agrf "$f"
          done
          sha256sum -- *.tar.gz > SHA256SUMS
          ls -la

      - name: Publish release
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
