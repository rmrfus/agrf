name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: agrf-x86_64-linux
          - target: aarch64-unknown-linux-musl
            artifact: agrf-aarch64-linux
          - target: armv7-unknown-linux-musleabihf
            artifact: agrf-armv7-linux

    steps:
      - uses: actions/checkout@v4

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: pip install ziglang && cargo install cargo-zigbuild

      - name: Build
        run: cargo zigbuild --target ${{ matrix.target }} --release --locked

      - name: Stage binary
        run: cp "target/${{ matrix.target }}/release/agrf" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # gzip -n keeps the archive reproducible (no name/mtime in the header).
      # Loop + glob so adding a target means editing only the build matrix.
      - name: Compress and checksum
        working-directory: dist
        run: |
          for f in agrf-*; do gzip -9 -n "$f"; done
          sha256sum -- *.gz > SHA256SUMS
          ls -la

      - name: Publish release
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.gz dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
