name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories are the reason for the schedule: one published after the last
  # commit is invisible until the next one, and this repo goes months without.
  # Known and accepted: GitHub disables a scheduled workflow in a public repo
  # after 60 days with no activity, which is the same dormancy this covers. The
  # months right after the last commit are when a fresh advisory matters most,
  # and that window is inside the 60 days — so no external driver for a tool
  # this small.
  schedule:
    - cron: '0 13 * * 1'

permissions:
  contents: read

jobs:
  check:
    # Pure Rust with one dependency, so rustup plus a cache beats spinning up
    # nix here: nothing in this crate needs a pinned C library.
    name: fmt · clippy · test · cross
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Add components
        run: rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # flake.nix claims aarch64-linux, and nothing else here builds it. An
      # unbuilt architecture in `systems` is a promise no job keeps; check-only
      # is cheap and catches the width/signedness class of breakage before a
      # tag does.
      - name: Cross-check aarch64
        run: |
          rustup target add aarch64-unknown-linux-gnu
          cargo check --target aarch64-unknown-linux-gnu --all-targets --locked

  msrv:
    # rust-version is otherwise a claim nothing checks: nix gives whatever
    # nixpkgs pins and the job above gives latest stable, so a floor that has
    # drifted stays green until a stranger runs `cargo install --locked`.
    name: msrv (declared floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned to the v1 branch with the version as an *input*, not as the ref.
      # On the version branches (@1.85.0) there is no `toolchain` input at all
      # and the floor is baked into the ref, so an action bump would silently
      # move it; here `toolchain` is required with no default, so dropping it
      # fails the job outright rather than testing the wrong floor.
      # The floor itself is read out of Cargo.toml below, so there is no second
      # copy to keep in step: raising `rust-version` moves the pin with it, and
      # an empty result fails the job outright for the same required-input
      # reason. It goes to `toolchain:` rather than into the ref because the
      # ref is a pinned SHA — a version string cannot take its place.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv

      - name: Check on the declared floor
        run: cargo check --locked

  nix:
    # The checks whose tools live in the devShell, plus the flake itself.
    name: man · advisories · unused deps · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # -z parses and reports without rendering, so a broken macro fails the
      # build instead of producing a mangled page nobody reads until they
      # need it.
      - name: Man page
        run: nix develop --command groff -man -Tutf8 -ww -z man/man1/agrf.1

      # RustSec advisories against the committed lockfile — covers what
      # cargo-audit does, so this is the only scanner here. `sources` is named
      # explicitly because `check advisories` does not run it, which would
      # leave the [sources] section of deny.toml as dead config.
      - name: Advisories
        run: nix develop --command cargo deny check advisories sources

      # A dependency nothing imports is not a crash; it keeps appearing in the
      # advisory scan above for code that is no longer called, and can hold the
      # MSRV higher than our own source needs.
      - name: Unused dependencies
        run: nix develop --command cargo machete

      # Not just a local convenience: without this the flake rots quietly and
      # the breakage lands on whoever first runs `nix run github:rmrfus/agrf`.
      # It also runs the suite a second time under doCheck, in a sandbox with
      # no network and no $HOME.
      - name: Package
        run: nix build
