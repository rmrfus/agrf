[package]
name = "agrf"
version = "0.3.2"
edition = "2024"
# Our own floor: edition 2024 needs 1.85, and clap 4.6 declares the same. It
# does not improve the error an older toolchain gives — the edition is rejected
# before this field is read. What it buys is the MSRV-aware resolver, clippy's
# incompatible_msrv, and a number the msrv CI job can check, so the floor has
# to track the newest feature actually used rather than being decorative.
rust-version = "1.85"
description = "Stream of int/float to unicode braille graphs"
homepage = "https://github.com/rmrfus/agrf"
repository = "https://github.com/rmrfus/agrf"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }

# The no-panic rule, machine-checked. These live in clippy's `restriction`
# group, which is allow-by-default and is not switched on by `clippy::all` or
# `pedantic` — each has to be named. `warn` plus the `-D warnings` CI already
# passes is what makes them fail; a crate-level `#![deny]` would poison
# #[cfg(test)] code and need an #[allow] on every test. See clippy.toml for the
# in-test exemptions.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# The four below turn house conventions into build failures rather than
# things a careless edit can undo with a green CI: `exit` enforces the
# ExitCode rule, `print_stdout` the "payload never goes through println!"
# rule, and the two unsafe ones the SAFETY-comment rule.
exit = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

[profile.release]
lto = true
strip = true
